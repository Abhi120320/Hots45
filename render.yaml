services:
  - type: web
    name: hots45-api
    runtime: python
    plan: free
    # app_data is gitignored (558 MB), so the build downloads it as a tarball from DATA_URL
    buildCommand: pip install -r backend/requirements.txt && curl -fsSL "$DATA_URL" | tar xz -C backend
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/meta
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATA_URL
        sync: false   # link to app_data.tar.gz (e.g. a GitHub Release asset)
      - key: CORS_ORIGINS
        sync: false   # your Vercel URL, e.g. https://hots45.vercel.app
      - key: FIRMS_MAP_KEY
        sync: false
