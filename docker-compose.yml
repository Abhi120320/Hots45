# docker compose up --build              -> app on http://localhost:8000
# docker compose run --rm prep --modis "data/modis_*.csv" --viirs "data/viirs-snpp_*.csv"
#                                         -> rebuilds backend/app_data from data_prep/data
services:
  app:
    build: { context: ., target: app }
    ports: ["${PORT:-8000}:8000"]
    env_file:
      - path: .env
        required: false  # FIRMS_MAP_KEY etc.; never baked into the image
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - ./backend/app_data:/app/backend/app_data:ro
    restart: unless-stopped

  prep:
    build: { context: ., target: prep }
    profiles: [prep]
    volumes:
      - ./data_prep/data:/app/data_prep/data:ro
      - ./backend/app_data:/app/backend/app_data
      - ./data_prep:/app/data_prep/charts
    command: ["--help"]
    entrypoint: ["python", "fire_harmonize.py", "--charts", "charts"]
